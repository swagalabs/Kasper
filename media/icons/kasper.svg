<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12082e"/>
      <stop offset="100%" stop-color="#070414"/>
    </linearGradient>
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="diamond">
      <polygon points="64,6 122,64 64,122 6,64"/>
    </clipPath>
  </defs>

  <!-- Outer diamond frame -->
  <polygon points="64,6 122,64 64,122 6,64"
           fill="url(#bgGrad)" stroke="url(#edgeGrad)" stroke-width="1.5"/>

  <!-- Subtle inner grid lines -->
  <line x1="6" y1="64" x2="122" y2="64" stroke="#4c1d95" stroke-width="0.5" opacity="0.4"/>
  <line x1="64" y1="6" x2="64" y2="122" stroke="#4c1d95" stroke-width="0.5" opacity="0.4"/>

  <!-- Secondary inner diamond (frame accent) -->
  <polygon points="64,20 108,64 64,108 20,64"
           fill="none" stroke="url(#edgeGrad)" stroke-width="0.8" opacity="0.5"/>

  <!-- Stylized K — vertical bar -->
  <rect x="38" y="36" width="9" height="56" rx="2"
        fill="url(#kGrad)" filter="url(#glow)"/>

  <!-- K upper arm -->
  <polygon points="47,64 47,36 58,36 80,64"
           fill="url(#kGrad)" filter="url(#glow)"/>

  <!-- K lower arm -->
  <polygon points="47,64 80,92 58,92 47,64"
           fill="url(#kGrad)" filter="url(#glow)"/>

  <!-- Node accent top-right -->
  <circle cx="84" cy="36" r="4" fill="#c084fc" opacity="0.9" filter="url(#softGlow)"/>

  <!-- Node accent bottom-right -->
  <circle cx="84" cy="92" r="4" fill="#38bdf8" opacity="0.9" filter="url(#softGlow)"/>

  <!-- Corner accent dots on diamond -->
  <circle cx="64" cy="8" r="2" fill="#7c3aed" opacity="0.7"/>
  <circle cx="120" cy="64" r="2" fill="#7c3aed" opacity="0.5"/>
  <circle cx="64" cy="120" r="2" fill="#7c3aed" opacity="0.5"/>
  <circle cx="8" cy="64" r="2" fill="#7c3aed" opacity="0.5"/>
</svg>
