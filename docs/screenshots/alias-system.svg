<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="400" fill="#1e1e1e" rx="8"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Kasper Alias System</text>
  <text x="350" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888888">Human-readable identifiers that work across all modules</text>

  <!-- Table Header -->
  <rect x="20" y="62" width="660" height="24" rx="4" fill="#2a2a2a"/>
  <text x="52" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#888888">PREFIX</text>
  <text x="120" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#888888">TYPE</text>
  <text x="270" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#888888">EXAMPLES</text>
  <text x="520" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#888888">RESOLVES TO</text>

  <!-- Row 1: @ People -->
  <rect x="20" y="90" width="660" height="36" rx="4" fill="#252525"/>
  <rect x="30" y="97" width="28" height="22" rx="4" fill="#4285f4" opacity="0.15"/>
  <text x="44" y="113" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#4285f4">@</text>
  <text x="120" y="113" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cccccc">People</text>
  <text x="270" y="113" font-family="monospace" font-size="10" fill="#4285f4">@anna  @dmytro  @maxim</text>
  <text x="520" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#999999">"Anna Kovalenko"</text>
  <text x="520" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666666">Chat DM / GitHub profile</text>

  <!-- Row 2: # Channels & Teams -->
  <rect x="20" y="130" width="660" height="36" rx="4" fill="#222222"/>
  <rect x="30" y="137" width="28" height="22" rx="4" fill="#34a853" opacity="0.15"/>
  <text x="44" y="153" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#34a853">#</text>
  <text x="120" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cccccc">Channels &amp; Teams</text>
  <text x="270" y="153" font-family="monospace" font-size="10" fill="#34a853">#backend  #frontend  #team-devops</text>
  <text x="520" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#999999">Chat space / GitHub team</text>
  <text x="520" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666666">Group communication target</text>

  <!-- Row 3: $ Repositories -->
  <rect x="20" y="170" width="660" height="36" rx="4" fill="#252525"/>
  <rect x="30" y="177" width="28" height="22" rx="4" fill="#7057ff" opacity="0.15"/>
  <text x="44" y="193" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#7057ff">$</text>
  <text x="120" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cccccc">Repositories</text>
  <text x="270" y="193" font-family="monospace" font-size="10" fill="#7057ff">$kasper  $kasper-api  $kasper-ui</text>
  <text x="520" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#999999">GitHub repo page</text>
  <text x="520" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666666">Code browsing target</text>

  <!-- Row 4: ! Projects -->
  <rect x="20" y="210" width="660" height="36" rx="4" fill="#222222"/>
  <rect x="30" y="217" width="28" height="22" rx="4" fill="#f78166" opacity="0.15"/>
  <text x="44" y="233" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#f78166">!</text>
  <text x="120" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cccccc">Projects</text>
  <text x="270" y="233" font-family="monospace" font-size="10" fill="#f78166">!q2-roadmap  !auth-migration</text>
  <text x="520" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#999999">GitHub project board</text>
  <text x="520" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666666">Task management view</text>

  <!-- Row 5: ~ Events & Meetings -->
  <rect x="20" y="250" width="660" height="36" rx="4" fill="#252525"/>
  <rect x="30" y="257" width="28" height="22" rx="4" fill="#fbbc05" opacity="0.15"/>
  <text x="44" y="273" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#fbbc05">~</text>
  <text x="120" y="273" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cccccc">Events &amp; Meetings</text>
  <text x="270" y="273" font-family="monospace" font-size="10" fill="#fbbc05">~standup  ~sprint-planning</text>
  <text x="520" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#999999">Calendar event / Meet link</text>
  <text x="520" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666666">Scheduling target</text>

  <!-- Divider -->
  <line x1="40" y1="302" x2="660" y2="302" stroke="#333333" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="350" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666666">Resolution Flow</text>

  <!-- Flow diagram -->
  <!-- Step 1: User types -->
  <rect x="30" y="330" width="130" height="44" rx="8" fill="#2a2a2a" stroke="#4285f4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="95" y="349" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#cccccc">User clicks</text>
  <text x="95" y="364" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#4285f4">@anna</text>

  <!-- Arrow 1 -->
  <path d="M 164 352 L 185 352" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Step 2: AliasManager -->
  <rect x="190" y="330" width="150" height="44" rx="8" fill="#2a2a2a" stroke="#7057ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="265" y="349" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#cccccc">AliasManager</text>
  <text x="265" y="364" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7057ff">resolves alias</text>

  <!-- Arrow 2 -->
  <path d="M 344 352 L 365 352" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Navigator -->
  <rect x="370" y="330" width="150" height="44" rx="8" fill="#2a2a2a" stroke="#34a853" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="445" y="349" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#cccccc">Navigator</text>
  <text x="445" y="364" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#34a853">opens GitHub Org</text>

  <!-- Arrow 3 -->
  <path d="M 524 352 L 545 352" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Step 4: Result -->
  <rect x="550" y="330" width="130" height="44" rx="8" fill="#2a2a2a" stroke="#fbbc05" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="615" y="349" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#cccccc">Scrolls to</text>
  <text x="615" y="364" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#fbbc05">Anna's profile</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555555"/>
    </marker>
  </defs>
</svg>