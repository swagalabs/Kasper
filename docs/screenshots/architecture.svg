<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="vscodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#252526"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="0" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#cccccc" font-size="16" font-weight="600" letter-spacing="0.5">Kasper  --  VS Code Extension</text>
  <line x1="250" y1="42" x2="550" y2="42" stroke="#4285f4" stroke-width="2" stroke-opacity="0.5"/>

  <!-- VS Code container -->
  <rect x="30" y="55" width="740" height="330" rx="10" fill="url(#vscodeGrad)" stroke="#3c3c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="54" y="77" fill="#888" font-size="10" font-weight="500" letter-spacing="1">VS CODE</text>
  <circle cx="42" cy="73" r="3.5" fill="#ea4335"/>
  <circle cx="726" cy="73" r="3.5" fill="#34a853"/>
  <circle cx="758" cy="73" r="3.5" fill="#fbbc05"/>

  <!-- Activity Bar (left strip) -->
  <rect x="38" y="88" width="42" height="288" rx="6" fill="#1e1e1e" stroke="#3c3c3c" stroke-width="1"/>
  <!-- Kasper icon placeholder -->
  <rect x="46" y="96" width="26" height="26" rx="5" fill="#4285f4" fill-opacity="0.15" stroke="#4285f4" stroke-width="1"/>
  <text x="59" y="113" text-anchor="middle" fill="#4285f4" font-size="13" font-weight="700">K</text>
  <!-- secondary icons -->
  <rect x="48" y="132" width="22" height="22" rx="4" fill="transparent" stroke="#555" stroke-width="0.8"/>
  <rect x="48" y="160" width="22" height="22" rx="4" fill="transparent" stroke="#555" stroke-width="0.8"/>
  <rect x="48" y="188" width="22" height="22" rx="4" fill="transparent" stroke="#555" stroke-width="0.8"/>
  <text x="59" y="147" text-anchor="middle" fill="#666" font-size="10">E</text>
  <text x="59" y="175" text-anchor="middle" fill="#666" font-size="10">S</text>
  <text x="59" y="203" text-anchor="middle" fill="#666" font-size="10">G</text>

  <!-- Sidebar panels (6 cards) -->
  <!-- Google Chat -->
  <rect x="94" y="92" width="180" height="42" rx="6" fill="#1e1e1e" stroke="#4285f4" stroke-width="1.2"/>
  <circle cx="112" cy="113" r="8" fill="#4285f4" fill-opacity="0.2" stroke="#4285f4" stroke-width="1"/>
  <text x="112" y="117" text-anchor="middle" fill="#4285f4" font-size="9" font-weight="700">C</text>
  <text x="128" y="110" fill="#cccccc" font-size="11" font-weight="500">Google Chat</text>
  <text x="128" y="122" fill="#888" font-size="8">Spaces, threads, DMs</text>

  <!-- Google Meet -->
  <rect x="94" y="140" width="180" height="42" rx="6" fill="#1e1e1e" stroke="#34a853" stroke-width="1.2"/>
  <circle cx="112" cy="161" r="8" fill="#34a853" fill-opacity="0.2" stroke="#34a853" stroke-width="1"/>
  <text x="112" y="165" text-anchor="middle" fill="#34a853" font-size="9" font-weight="700">M</text>
  <text x="128" y="158" fill="#cccccc" font-size="11" font-weight="500">Google Meet</text>
  <text x="128" y="170" fill="#888" font-size="8">Meetings, scheduling</text>

  <!-- Google Calendar -->
  <rect x="94" y="188" width="180" height="42" rx="6" fill="#1e1e1e" stroke="#fbbc05" stroke-width="1.2"/>
  <circle cx="112" cy="209" r="8" fill="#fbbc05" fill-opacity="0.2" stroke="#fbbc05" stroke-width="1"/>
  <text x="112" y="213" text-anchor="middle" fill="#fbbc05" font-size="9" font-weight="700">C</text>
  <text x="128" y="206" fill="#cccccc" font-size="11" font-weight="500">Google Calendar</text>
  <text x="128" y="218" fill="#888" font-size="8">Events, reminders</text>

  <!-- GitHub Organization -->
  <rect x="94" y="240" width="180" height="42" rx="6" fill="#1e1e1e" stroke="#7057ff" stroke-width="1.2"/>
  <circle cx="112" cy="261" r="8" fill="#7057ff" fill-opacity="0.2" stroke="#7057ff" stroke-width="1"/>
  <text x="112" y="265" text-anchor="middle" fill="#7057ff" font-size="9" font-weight="700">O</text>
  <text x="128" y="258" fill="#cccccc" font-size="11" font-weight="500">GitHub Organization</text>
  <text x="128" y="270" fill="#888" font-size="8">Members, teams</text>

  <!-- GitHub Repos -->
  <rect x="94" y="288" width="180" height="42" rx="6" fill="#1e1e1e" stroke="#8b949e" stroke-width="1.2"/>
  <circle cx="112" cy="309" r="8" fill="#8b949e" fill-opacity="0.2" stroke="#8b949e" stroke-width="1"/>
  <text x="112" y="313" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="700">R</text>
  <text x="128" y="306" fill="#cccccc" font-size="11" font-weight="500">GitHub Repos</text>
  <text x="128" y="318" fill="#888" font-size="8">Issues, PRs, code</text>

  <!-- GitHub Projects -->
  <rect x="94" y="336" width="180" height="42" rx="6" fill="#1e1e1e" stroke="#f78166" stroke-width="1.2"/>
  <circle cx="112" cy="357" r="8" fill="#f78166" fill-opacity="0.2" stroke="#f78166" stroke-width="1"/>
  <text x="112" y="361" text-anchor="middle" fill="#f78166" font-size="9" font-weight="700">P</text>
  <text x="128" y="354" fill="#cccccc" font-size="11" font-weight="500">GitHub Projects</text>
  <text x="128" y="366" fill="#888" font-size="8">Boards, items, views</text>

  <!-- Alias Manager box -->
  <rect x="300" y="92" width="220" height="148" rx="8" fill="#1e1e1e" stroke="#4285f4" stroke-width="1.2"/>
  <rect x="300" y="92" width="220" height="28" rx="8" fill="#4285f4" fill-opacity="0.1"/>
  <!-- clip bottom corners of header -->
  <rect x="300" y="108" width="220" height="12" fill="#4285f4" fill-opacity="0.1"/>
  <text x="410" y="111" text-anchor="middle" fill="#4285f4" font-size="12" font-weight="600">Alias Manager</text>
  <line x1="310" y1="124" x2="510" y2="124" stroke="#3c3c3c" stroke-width="0.8"/>

  <text x="316" y="142" fill="#4285f4" font-size="10" font-weight="500">@anna</text>
  <text x="362" y="142" fill="#888" font-size="9">person alias</text>

  <text x="316" y="158" fill="#34a853" font-size="10" font-weight="500">#backend</text>
  <text x="374" y="158" fill="#888" font-size="9">channel / team</text>

  <text x="316" y="174" fill="#fbbc05" font-size="10" font-weight="500">$kasper</text>
  <text x="366" y="174" fill="#888" font-size="9">project ref</text>

  <text x="316" y="190" fill="#7057ff" font-size="10" font-weight="500">~standup</text>
  <text x="374" y="190" fill="#888" font-size="9">recurring event</text>

  <text x="316" y="206" fill="#ea4335" font-size="10" font-weight="500">!q2-roadmap</text>
  <text x="390" y="206" fill="#888" font-size="9">pinned item</text>

  <text x="316" y="228" fill="#666" font-size="8" font-style="italic">Universal shortcuts across all modules</text>

  <!-- Navigator box -->
  <rect x="300" y="252" width="220" height="126" rx="8" fill="#1e1e1e" stroke="#34a853" stroke-width="1.2"/>
  <rect x="300" y="252" width="220" height="28" rx="8" fill="#34a853" fill-opacity="0.1"/>
  <rect x="300" y="268" width="220" height="12" fill="#34a853" fill-opacity="0.1"/>
  <text x="410" y="271" text-anchor="middle" fill="#34a853" font-size="12" font-weight="600">Navigator</text>
  <line x1="310" y1="284" x2="510" y2="284" stroke="#3c3c3c" stroke-width="0.8"/>

  <!-- Navigation arrows -->
  <text x="316" y="302" fill="#cccccc" font-size="9">Chat</text>
  <line x1="342" y1="299" x2="374" y2="299" stroke="#4285f4" stroke-width="1" marker-end="url(#arrowBlue)"/>
  <text x="380" y="302" fill="#cccccc" font-size="9">Calendar</text>

  <text x="316" y="322" fill="#cccccc" font-size="9">Meet</text>
  <line x1="342" y1="319" x2="374" y2="319" stroke="#34a853" stroke-width="1" marker-end="url(#arrowGreen)"/>
  <text x="380" y="322" fill="#cccccc" font-size="9">Repos</text>

  <text x="316" y="342" fill="#cccccc" font-size="9">Projects</text>
  <line x1="358" y1="339" x2="374" y2="339" stroke="#f78166" stroke-width="1" marker-end="url(#arrowOrange)"/>
  <text x="380" y="342" fill="#cccccc" font-size="9">Org</text>

  <text x="316" y="368" fill="#666" font-size="8" font-style="italic">Cross-module jump with Ctrl+Shift+K</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#4285f4"/>
    </marker>
    <marker id="arrowGreen" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#34a853"/>
    </marker>
    <marker id="arrowOrange" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#f78166"/>
    </marker>
    <marker id="arrowDown" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
      <polygon points="0 0, 6 0, 3 6" fill="#4285f4"/>
    </marker>
    <marker id="arrowDownGray" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
      <polygon points="0 0, 6 0, 3 6" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Right side summary panel -->
  <rect x="540" y="92" width="220" height="286" rx="8" fill="#1e1e1e" stroke="#3c3c3c" stroke-width="1"/>
  <text x="650" y="116" text-anchor="middle" fill="#cccccc" font-size="11" font-weight="600">Extension Architecture</text>
  <line x1="555" y1="124" x2="745" y2="124" stroke="#3c3c3c" stroke-width="0.8"/>

  <!-- Google section -->
  <text x="560" y="144" fill="#888" font-size="9" font-weight="600" letter-spacing="0.8">GOOGLE WORKSPACE</text>
  <circle cx="568" cy="160" r="4" fill="#4285f4"/>
  <text x="578" y="163" fill="#aaa" font-size="9">Chat API</text>
  <circle cx="568" cy="178" r="4" fill="#34a853"/>
  <text x="578" y="181" fill="#aaa" font-size="9">Meet API</text>
  <circle cx="568" cy="196" r="4" fill="#fbbc05"/>
  <text x="578" y="199" fill="#aaa" font-size="9">Calendar API</text>

  <line x1="555" y1="212" x2="745" y2="212" stroke="#3c3c3c" stroke-width="0.5"/>

  <!-- GitHub section -->
  <text x="560" y="232" fill="#888" font-size="9" font-weight="600" letter-spacing="0.8">GITHUB</text>
  <circle cx="568" cy="248" r="4" fill="#7057ff"/>
  <text x="578" y="251" fill="#aaa" font-size="9">Organization API</text>
  <circle cx="568" cy="266" r="4" fill="#8b949e"/>
  <text x="578" y="269" fill="#aaa" font-size="9">Repos / REST + GraphQL</text>
  <circle cx="568" cy="284" r="4" fill="#f78166"/>
  <text x="578" y="287" fill="#aaa" font-size="9">Projects v2 (GraphQL)</text>

  <line x1="555" y1="300" x2="745" y2="300" stroke="#3c3c3c" stroke-width="0.5"/>

  <!-- Core features -->
  <text x="560" y="320" fill="#888" font-size="9" font-weight="600" letter-spacing="0.8">CORE</text>
  <circle cx="568" cy="336" r="4" fill="#4285f4"/>
  <text x="578" y="339" fill="#aaa" font-size="9">Alias Manager</text>
  <circle cx="568" cy="354" r="4" fill="#34a853"/>
  <text x="578" y="357" fill="#aaa" font-size="9">Navigator</text>
  <circle cx="568" cy="372" r="4" fill="#ea4335"/>
  <text x="578" y="375" fill="#aaa" font-size="9">Auth &amp; Token Store</text>

  <!-- Bottom row: External services -->
  <!-- Google Workspace API -->
  <rect x="80" y="410" width="280" height="72" rx="8" fill="#252526" stroke="#4285f4" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="220" y="434" text-anchor="middle" fill="#cccccc" font-size="12" font-weight="600">Google Workspace API</text>
  <line x1="100" y1="442" x2="340" y2="442" stroke="#3c3c3c" stroke-width="0.5"/>
  <text x="140" y="458" text-anchor="middle" fill="#4285f4" font-size="9">Chat</text>
  <text x="220" y="458" text-anchor="middle" fill="#34a853" font-size="9">Meet</text>
  <text x="300" y="458" text-anchor="middle" fill="#fbbc05" font-size="9">Calendar</text>
  <!-- Bubbles under labels -->
  <rect x="118" y="462" width="44" height="12" rx="3" fill="#4285f4" fill-opacity="0.12"/>
  <text x="140" y="471" text-anchor="middle" fill="#4285f4" font-size="7">REST</text>
  <rect x="198" y="462" width="44" height="12" rx="3" fill="#34a853" fill-opacity="0.12"/>
  <text x="220" y="471" text-anchor="middle" fill="#34a853" font-size="7">REST</text>
  <rect x="278" y="462" width="44" height="12" rx="3" fill="#fbbc05" fill-opacity="0.12"/>
  <text x="300" y="471" text-anchor="middle" fill="#fbbc05" font-size="7">REST</text>

  <!-- GitHub API -->
  <rect x="440" y="410" width="280" height="72" rx="8" fill="#252526" stroke="#8b949e" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="580" y="434" text-anchor="middle" fill="#cccccc" font-size="12" font-weight="600">GitHub API</text>
  <line x1="460" y1="442" x2="700" y2="442" stroke="#3c3c3c" stroke-width="0.5"/>
  <text x="500" y="458" text-anchor="middle" fill="#7057ff" font-size="9">Org</text>
  <text x="580" y="458" text-anchor="middle" fill="#8b949e" font-size="9">Repos</text>
  <text x="660" y="458" text-anchor="middle" fill="#f78166" font-size="9">Projects</text>
  <rect x="478" y="462" width="44" height="12" rx="3" fill="#7057ff" fill-opacity="0.12"/>
  <text x="500" y="471" text-anchor="middle" fill="#7057ff" font-size="7">REST</text>
  <rect x="555" y="462" width="50" height="12" rx="3" fill="#8b949e" fill-opacity="0.12"/>
  <text x="580" y="471" text-anchor="middle" fill="#8b949e" font-size="7">REST+GQL</text>
  <rect x="635" y="462" width="50" height="12" rx="3" fill="#f78166" fill-opacity="0.12"/>
  <text x="660" y="471" text-anchor="middle" fill="#f78166" font-size="7">GraphQL</text>

  <!-- Connection lines: VS Code to Google API -->
  <line x1="184" y1="385" x2="184" y2="410" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowDown)"/>
  <line x1="220" y1="385" x2="220" y2="410" stroke="#34a853" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowDown)"/>
  <line x1="256" y1="385" x2="256" y2="410" stroke="#fbbc05" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Connection lines: VS Code to GitHub API -->
  <line x1="540" y1="385" x2="540" y2="410" stroke="#7057ff" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowDownGray)"/>
  <line x1="580" y1="385" x2="580" y2="410" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowDownGray)"/>
  <line x1="620" y1="385" x2="620" y2="410" stroke="#f78166" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Footer -->
  <text x="400" y="496" text-anchor="middle" fill="#555" font-size="8">Kasper Architecture  |  All modules communicate via the Navigator and share aliases through the Alias Manager</text>
</svg>