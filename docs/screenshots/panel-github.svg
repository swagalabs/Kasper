  <text x="388" y="45" text-anchor="middle" class="text" font-size="9">5 repos</text>
  <text x="422" y="45" class="text-muted" font-size="9">&#x2B50; 237 stars</text>
  <text x="496" y="45" class="text-muted" font-size="9">&#x1F4C4; 38 issues</text>

  <!-- Search Box -->
  <rect x="362" y="56" width="326" height="24" rx="3" class="search-bg"/>
  <text x="374" y="72" class="text-muted" font-size="10">&#x1F50D; Search repos...</text>

  <!-- Repo: kasper -->
  <rect x="362" y="86" width="326" height="86" rx="4" class="card-bg"/>
  <text x="374" y="104" class="text-blue" font-size="12" font-weight="600">kasper</text>
  <rect x="418" y="93" width="42" height="14" rx="7" class="badge-public"/>
  <text x="439" y="103" text-anchor="middle" fill="#2ea043" font-family="sans-serif" font-size="8" font-weight="500">public</text>
  <text x="374" y="120" class="text" font-size="10">VS Code fork with collaborative integrations</text>
  <text x="374" y="136" class="text-muted" font-size="9">&#x1F535; TypeScript  &#x2B50;128  &#x1F517;15  &#x1F4C4;23 · updated 2h ago</text>
  <text x="374" y="152" font-size="9">
    <tspan class="text-blue">$kasper</tspan>
    <tspan class="text-muted"> · swagalabs/kasper</tspan>
  </text>

  <!-- Repo: kasper-api -->
  <rect x="362" y="178" width="326" height="86" rx="4" class="card-bg"/>
  <text x="374" y="196" class="text-blue" font-size="12" font-weight="600">kasper-api</text>
  <rect x="445" y="185" width="42" height="14" rx="7" class="badge-public"/>
  <text x="466" y="195" text-anchor="middle" fill="#2ea043" font-family="sans-serif" font-size="8" font-weight="500">public</text>
  <text x="374" y="212" class="text" font-size="10">Backend API for Kasper services</text>
  <text x="374" y="228" class="text-muted" font-size="9">&#x1F535; Go  &#x2B50;45  &#x1F517;8  &#x1F4C4;7 · updated 45m ago</text>
  <text x="374" y="244" class="text-blue" font-size="9">$kasper-api</text>

  <!-- Repo: kasper-infra -->
  <rect x="362" y="270" width="326" height="86" rx="4" class="card-bg"/>
  <text x="374" y="288" class="text-blue" font-size="12" font-weight="600">kasper-infra</text>
  <rect x="457" y="277" width="44" height="14" rx="7" class="badge-private"/>
  <text x="479" y="287" text-anchor="middle" fill="#d29922" font-family="sans-serif" font-size="8" font-weight="500">private</text>
  <text x="374" y="304" class="text" font-size="10">Terraform &amp; K8s configs</text>
  <text x="374" y="320" class="text-muted" font-size="9">&#x1F7E3; HCL  &#x2B50;12  &#x1F517;2  &#x1F4C4;1 · updated 30m ago</text>
  <text x="374" y="336" class="text-blue" font-size="9">$kasper-infra</text>
</svg>