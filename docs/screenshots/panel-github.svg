<svg xmlns="http://www.w3.org/2000/svg" width="700" height="550" viewBox="0 0 700 550">
  <defs>
    <style>
      .bg { fill: #252526; }
      .panel-bg { fill: #1e1e1e; }
      .text { fill: #cccccc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .text-muted { fill: #888888; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .text-bold { fill: #cccccc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600; }
      .text-blue { fill: #4285f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .section-header { fill: #888888; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }
      .card-bg { fill: #2d2d2d; }
      .search-bg { fill: #3c3c3c; }
      .border-blue { stroke: #4285f4; stroke-width: 1; fill: none; }
      .badge-public { fill: #2ea04366; }
      .badge-private { fill: #d29922aa; }
      .badge-admin { fill: #d29922; }
      .badge-member { fill: #555555; }
      .avatar-blue { fill: #4285f4; }
      .avatar-green { fill: #2ea043; }
      .avatar-purple { fill: #8b5cf6; }
      .avatar-orange { fill: #d97706; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="700" height="550" class="bg"/>

  <!-- Left Panel -->
  <rect x="4" y="4" width="344" height="542" rx="4" class="panel-bg"/>

  <!-- Left Panel Header -->
  <text x="18" y="26" class="text" font-size="12" font-weight="600">&#x1F3E0; GitHub Organization</text>

  <!-- Org Card -->
  <rect x="12" y="36" width="328" height="88" rx="4" class="border-blue"/>
  <rect x="12" y="36" width="328" height="88" rx="4" fill="#1e1e1e"/>
  <rect x="12" y="36" width="328" height="88" rx="4" class="border-blue"/>

  <!-- Org Avatar -->
  <circle cx="40" cy="68" r="18" class="avatar-blue"/>
  <text x="40" y="73" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12" font-weight="600">SL</text>

  <!-- Org Info -->
  <text x="66" y="62" class="text-bold" font-size="13">SwagaLabs</text>
  <text x="66" y="76" class="text-muted" font-size="10">#swagalabs · swagalabs</text>
  <text x="66" y="90" class="text-muted" font-size="10">Building collaborative development tools</text>

  <!-- Org Stats -->
  <text x="66" y="112" class="text-muted" font-size="10">&#x1F465; 6 members · &#x1F527; 4 teams</text>

  <!-- TEAMS Section -->
  <text x="14" y="146" class="section-header">TEAMS</text>

  <!-- Team: Backend -->
  <rect x="12" y="152" width="328" height="38" rx="3" class="card-bg"/>
  <text x="20" y="168" class="text" font-size="11" font-weight="500">Backend</text>
  <text x="20" y="182" class="text-muted" font-size="9">#team-backend · API &amp; services</text>
  <rect x="308" y="160" width="22" height="16" rx="8" fill="#4285f4"/>
  <text x="319" y="172" text-anchor="middle" fill="white" font-family="sans-serif" font-size="9" font-weight="600">3</text>

  <!-- Team: Frontend -->
  <rect x="12" y="194" width="328" height="38" rx="3" class="card-bg"/>
  <text x="20" y="210" class="text" font-size="11" font-weight="500">Frontend</text>
  <text x="20" y="224" class="text-muted" font-size="9">#team-frontend · UI &amp; UX</text>
  <rect x="308" y="202" width="22" height="16" rx="8" fill="#4285f4"/>
  <text x="319" y="214" text-anchor="middle" fill="white" font-family="sans-serif" font-size="9" font-weight="600">3</text>

  <!-- Team: DevOps -->
  <rect x="12" y="236" width="328" height="38" rx="3" class="card-bg"/>
  <text x="20" y="252" class="text" font-size="11" font-weight="500">DevOps</text>
  <text x="20" y="266" class="text-muted" font-size="9">#team-devops · Infrastructure</text>
  <rect x="308" y="244" width="22" height="16" rx="8" fill="#4285f4"/>
  <text x="319" y="256" text-anchor="middle" fill="white" font-family="sans-serif" font-size="9" font-weight="600">2</text>

