  <!-- Member: Anna -->
  <rect x="12" y="332" width="328" height="48" rx="3" class="card-bg"/>
  <circle cx="34" cy="356" r="14" class="avatar-green"/>
  <text x="34" y="360" text-anchor="middle" fill="white" font-family="sans-serif" font-size="9" font-weight="600">AK</text>
  <text x="56" y="349" class="text-bold" font-size="11">Анна Коваленко</text>
  <text x="56" y="363" class="text-muted" font-size="9">@anna · anna.k</text>
  <text x="56" y="375" class="text-blue" font-size="9">@anna</text>
  <rect x="290" y="345" width="40" height="14" rx="7" class="badge-admin"/>
  <text x="310" y="355" text-anchor="middle" fill="#1e1e1e" font-family="sans-serif" font-size="8" font-weight="600">admin</text>

  <!-- Member: Dmytro -->
  <rect x="12" y="384" width="328" height="48" rx="3" class="card-bg"/>
  <circle cx="34" cy="408" r="14" class="avatar-purple"/>
  <text x="34" y="412" text-anchor="middle" fill="white" font-family="sans-serif" font-size="9" font-weight="600">DW</text>
  <text x="56" y="401" class="text-bold" font-size="11">Дмитро Шевченко</text>
  <text x="56" y="415" class="text-muted" font-size="9">@dmytro · dmytro.s</text>
  <text x="56" y="427" class="text-blue" font-size="9">@dmytro</text>
  <rect x="282" y="397" width="48" height="14" rx="7" class="badge-member"/>
  <text x="306" y="407" text-anchor="middle" fill="#cccccc" font-family="sans-serif" font-size="8" font-weight="500">member</text>

  <!-- Member: Olena -->
  <rect x="12" y="436" width="328" height="48" rx="3" class="card-bg"/>
  <circle cx="34" cy="460" r="14" class="avatar-orange"/>
  <text x="34" y="464" text-anchor="middle" fill="white" font-family="sans-serif" font-size="9" font-weight="600">OP</text>
  <text x="56" y="453" class="text-bold" font-size="11">Олена Петренко</text>
  <text x="56" y="467" class="text-muted" font-size="9">@olena · olena.p</text>
  <text x="56" y="479" class="text-blue" font-size="9">@olena</text>
  <rect x="282" y="449" width="48" height="14" rx="7" class="badge-member"/>
  <text x="306" y="459" text-anchor="middle" fill="#cccccc" font-family="sans-serif" font-size="8" font-weight="500">member</text>

  <!-- Divider -->
  <rect x="350" y="4" width="1" height="542" fill="#3c3c3c"/>

  <!-- Right Panel -->
  <rect x="352" y="4" width="344" height="542" rx="4" class="panel-bg"/>

  <!-- Right Panel Header -->
  <text x="366" y="26" class="text" font-size="12" font-weight="600">&#x1F4E6; GitHub Repos</text>

