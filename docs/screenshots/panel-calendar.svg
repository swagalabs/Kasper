<svg xmlns="http://www.w3.org/2000/svg" width="350" height="550" viewBox="0 0 350 550">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&amp;display=swap');
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
  </defs>

  <!-- Panel background -->
  <rect width="350" height="550" rx="0" fill="#1e1e1e"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="350" height="38" fill="#252526"/>
  <text x="14" y="25" fill="#cccccc" font-size="12" font-weight="600" letter-spacing="0.3">
    <tspan>&#x1F4C5;  Google Calendar</tspan>
  </text>
  <!-- collapse chevron -->
  <text x="326" y="25" fill="#888888" font-size="11" text-anchor="end">&#x2026;</text>

  <!-- Subheader: Today row -->
  <rect x="0" y="38" width="350" height="32" fill="#252526"/>
  <text x="14" y="58" fill="#cccccc" font-size="11" font-weight="600">Today &mdash; June 10, 2026</text>
  <!-- Badge: 4 events -->
  <rect x="178" y="45" width="56" height="18" rx="9" fill="#3c3c3c"/>
  <text x="206" y="57" fill="#cccccc" font-size="10" text-anchor="middle">4 events</text>

  <!-- Divider -->
  <line x1="0" y1="70" x2="350" y2="70" stroke="#333333" stroke-width="1"/>

  <!-- ===== TIMELINE ===== -->

  <!-- 10:00 — Daily Standup (Blue, current) -->
  <text x="14" y="94" fill="#888888" font-size="10" font-weight="600">10:00</text>
  <!-- Connector dot -->
  <circle cx="52" cy="90" r="3" fill="#4a9eff"/>
  <line x1="52" y1="93" x2="52" y2="115" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Event card -->
  <rect x="64" y="78" width="272" height="80" rx="5" fill="#252526"/>
  <!-- Blue left border (current indicator) -->
  <rect x="64" y="78" width="3" height="80" rx="1.5" fill="#4a9eff"/>

  <text x="78" y="96" fill="#e0e0e0" font-size="12" font-weight="600">Daily Standup</text>
  <!-- Current badge -->
  <rect x="180" y="84" width="48" height="16" rx="3" fill="rgba(74,158,255,0.15)"/>
  <text x="204" y="95" fill="#4a9eff" font-size="9" text-anchor="middle" font-weight="600">current</text>

  <text x="78" y="112" fill="#888888" font-size="10">~standup  &#x00B7;  10:00&#x2013;10:15</text>
  <text x="78" y="127" fill="#888888" font-size="10">@anna  @dmytro  @maxim</text>

  <!-- Join button -->
  <rect x="78" y="136" width="58" height="18" rx="3" fill="rgba(74,158,255,0.12)"/>
  <text x="107" y="148" fill="#4a9eff" font-size="10" text-anchor="middle" font-weight="600">&#x1F3AC; Join</text>

  <!-- 11:00 — Design Review (Green) -->
  <text x="14" y="184" fill="#888888" font-size="10" font-weight="600">11:00</text>
  <circle cx="52" cy="180" r="3" fill="#4ec995"/>
  <line x1="52" y1="183" x2="52" y2="205" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>

  <rect x="64" y="168" width="272" height="62" rx="5" fill="#252526"/>
  <rect x="64" y="168" width="3" height="62" rx="1.5" fill="#4ec995"/>

  <text x="78" y="187" fill="#e0e0e0" font-size="12" font-weight="600">Design Review</text>
  <text x="78" y="203" fill="#888888" font-size="10">~design-review  &#x00B7;  11:00&#x2013;11:45</text>
  <text x="78" y="219" fill="#888888" font-size="10">@olena  @iryna</text>

  <!-- 12:00 — Lunch Break (Yellow) -->
  <text x="14" y="256" fill="#888888" font-size="10" font-weight="600">12:00</text>
  <circle cx="52" cy="252" r="3" fill="#e2b93d"/>
  <line x1="52" y1="255" x2="52" y2="277" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>

  <rect x="64" y="240" width="272" height="46" rx="5" fill="#252526"/>
  <rect x="64" y="240" width="3" height="46" rx="1.5" fill="#e2b93d"/>

  <text x="78" y="259" fill="#e0e0e0" font-size="12" font-weight="600">Lunch Break</text>
  <text x="78" y="275" fill="#888888" font-size="10">~lunch  &#x00B7;  12:00&#x2013;13:00</text>

  <!-- 14:00 — Sprint Planning (Blue) -->
  <text x="14" y="312" fill="#888888" font-size="10" font-weight="600">14:00</text>
  <circle cx="52" cy="308" r="3" fill="#4a9eff"/>
  <line x1="52" y1="311" x2="52" y2="333" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>

  <rect x="64" y="296" width="272" height="62" rx="5" fill="#252526"/>
  <rect x="64" y="296" width="3" height="62" rx="1.5" fill="#4a9eff"/>

  <text x="78" y="315" fill="#e0e0e0" font-size="12" font-weight="600">Sprint Planning</text>
  <text x="78" y="331" fill="#888888" font-size="10">~sprint-planning  &#x00B7;  14:00&#x2013;15:00</text>
  <text x="78" y="347" fill="#888888" font-size="10">Review </text>
  <text x="120" y="347" fill="#4a9eff" font-size="10" font-weight="600">!q2-roadmap</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="14" y1="378" x2="336" y2="378" stroke="#333333" stroke-width="1"/>

  <!-- UPCOMING section header -->
  <text x="14" y="400" fill="#888888" font-size="10" font-weight="600" letter-spacing="0.8">UPCOMING</text>

  <!-- Red card: Code Freeze Deadline -->
  <rect x="14" y="412" width="322" height="52" rx="5" fill="#252526"/>
  <rect x="14" y="412" width="3" height="52" rx="1.5" fill="#e05252"/>

  <text x="28" y="433" fill="#e0e0e0" font-size="12" font-weight="600">Code Freeze Deadline</text>
  <!-- Deadline badge -->
  <rect x="188" y="421" width="52" height="16" rx="3" fill="rgba(224,82,82,0.15)"/>
  <text x="214" y="432" fill="#e05252" font-size="9" text-anchor="middle" font-weight="600">deadline</text>

  <text x="28" y="451" fill="#888888" font-size="10">~code-freeze  &#x00B7;  Jun 12</text>

  <!-- Bottom padding / subtle branding line -->
  <line x1="0" y1="484" x2="350" y2="484" stroke="#333333" stroke-width="1"/>
  <text x="175" y="504" fill="#555555" font-size="9" text-anchor="middle">Kasper  &#x00B7;  Google Calendar Integration</text>
</svg>